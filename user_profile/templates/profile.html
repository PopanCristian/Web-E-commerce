{%extends 'base.html' %}
{% load static %}

{% block content %}
{% if messages %}
    {% for message in messages %}
        
    <div class="alert alert-{{ message.tags }} alert-slide alert-dismissible fade show"" role="alert">
        <svg class="icon" width="5" height="5">
            <use href="#info-fill"></use>
        </svg>
        {{ message }}
      </div>
    {% endfor %}
{% endif %}
<div class="profile-container">
    <h2>Profil : {{ user.username }}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" readonly>
        </div>

        <div class="form-group">
            <label for="phone">Telefon:</label>
            <input type="text" id="phone" name="phone" value="{{ user.phone }}" readonly>

        </div>

        <div class="form-group">
            
            <label for="first_name">Prenume:</label>
            <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" readonly>
        </div>

        <div class="form-group">
            
            <label for="last_name">Nume:</label>
            <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" readonly>
        </div>
        <button type="button" class="edit-btn" onclick="enableEdit()">✏️</button>
        <button type="submit" id="save-btn" class="save-btn" style="display: none;">Save</button>
    </form>
</div>


<script src="{% static 'scripts.js' %}"></script>

{% endblock %}


{% block footer%} {%endblock%}
